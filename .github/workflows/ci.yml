name: blkcp CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release (Rust blkcp & C11 blkcp-c)
            build_cmd: make release
            test_cmd: make audit && make test && make test-c
            verify_bin: ./blkcp
          - name: C11 AddressSanitizer & UndefinedBehaviorSanitizer
            build_cmd: make CFLAGS="-fsanitize=address,undefined -O1 -g -pthread -Iinclude -Isrc -MMD -MP" LDFLAGS="-fsanitize=address,undefined" c-bins
            test_cmd: make test-c
            verify_bin: ./blkcp-c
          - name: C11 ThreadSanitizer
            build_cmd: make CFLAGS="-fsanitize=thread -O1 -g -pthread -Iinclude -Isrc -MMD -MP" LDFLAGS="-fsanitize=thread" c-bins
            test_cmd: make test-c
            verify_bin: ./blkcp-c

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liburing-dev libssl-dev libblake3-dev libncurses-dev

      - name: Compile blkcp and blkcp-tui
        run: ${{ matrix.build_cmd }}

      - name: Run 42-test regression suite
        run: ${{ matrix.test_cmd }}

      - name: Verify CLI options & version output
        run: |
          ${{ matrix.verify_bin }} --version
          ${{ matrix.verify_bin }} --help

  package-deb:
    name: Build Debian/Ubuntu Package (.deb)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper liburing-dev libssl-dev libblake3-dev libncurses-dev dpkg-dev cargo rustc

      - name: Build Debian Package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../blkcp_*.deb dist/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blkcp-deb
          path: dist/*.deb

      - name: Attach .deb to Release (if release exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^Version:' packaging/rpm/blkcp.spec | awk '{print $2}')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.deb --clobber
          fi

  package-rpm:
    name: Build Fedora/RHEL Package (.rpm)
    runs-on: ubuntu-24.04
    container: fedora:latest
    needs: build-and-test
    steps:
      - name: Install git and tar
        run: dnf install -y git tar rpm-build gcc make cargo rust liburing-devel openssl-devel libblake3-devel ncurses-devel gh

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM Package
        run: |
          VERSION=$(grep -m1 '^Version:' packaging/rpm/blkcp.spec | awk '{print $2}')
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          tar --transform "s,^\.,blkcp-${VERSION}," --exclude='.git' --exclude='packaging/arch/src' --exclude='packaging/arch/pkg' -czf ~/rpmbuild/SOURCES/v${VERSION}.tar.gz .
          rpmbuild -ba packaging/rpm/blkcp.spec
          mkdir -p dist
          cp ~/rpmbuild/RPMS/*/*.rpm dist/

      - name: Upload .rpm Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blkcp-rpm
          path: dist/*.rpm

      - name: Attach .rpm to Release (if release exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^Version:' packaging/rpm/blkcp.spec | awk '{print $2}')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.rpm --clobber
          fi
