name: blkcp CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Release (-O3, -flto)
            build_cmd: make release
            cflags: ""
            ldflags: ""
          - name: AddressSanitizer & UndefinedBehaviorSanitizer
            build_cmd: make CFLAGS="-fsanitize=address,undefined -O1 -g -pthread -Iinclude -Isrc -MMD -MP" LDFLAGS="-fsanitize=address,undefined"
            cflags: "-fsanitize=address,undefined -O1 -g -pthread -Iinclude -Isrc -MMD -MP"
            ldflags: "-fsanitize=address,undefined"
          - name: ThreadSanitizer
            build_cmd: make CFLAGS="-fsanitize=thread -O1 -g -pthread -Iinclude -Isrc -MMD -MP" LDFLAGS="-fsanitize=thread"
            cflags: "-fsanitize=thread -O1 -g -pthread -Iinclude -Isrc -MMD -MP"
            ldflags: "-fsanitize=thread"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential liburing-dev libssl-dev libncurses-dev

      - name: Compile blkcp and blkcp-tui
        run: ${{ matrix.build_cmd }}

      - name: Run test suite (32 tests)
        run: ./tests/run_tests.sh

      - name: Verify CLI options & version output
        run: |
          ./blkcp --version
          ./blkcp --help

  package-deb:
    name: Build Debian/Ubuntu Package (.deb)
    runs-on: ubuntu-24.04
    needs: build-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper liburing-dev libssl-dev libncurses-dev dpkg-dev

      - name: Build Debian Package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          cp ../blkcp_*.deb dist/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: blkcp-deb
          path: dist/*.deb

      - name: Attach .deb to Release (if release exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 dist/*.deb --clobber
          fi
